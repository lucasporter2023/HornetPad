# Builds HornetPad.apk and HornetPad.exe on GitHub (free) - no Android Studio needed.
# Push this folder to a GitHub repo, open the "Actions" tab, run "Build HornetPad",
# then download the "HornetPad" artifact.
name: Build HornetPad
on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk ../HornetPad.apk
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: Build Windows server
        working-directory: server
        run: GOOS=windows GOARCH=amd64 go build -ldflags="-s -w" -o ../HornetPad.exe .
      - uses: actions/upload-artifact@v4
        with:
          name: HornetPad
          path: |
            HornetPad.apk
            HornetPad.exe
