plugins {
    id "com.android.application"
}

android {
    namespace "com.hornetpad"
    compileSdk 35

    defaultConfig {
        applicationId "com.hornetpad"
        minSdk 26
        // 35 (not 36) so the landscape lock is still honored on Android 16 tablets.
        targetSdk 35
        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            // Signed with the debug key so the APK installs without a keystore.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
